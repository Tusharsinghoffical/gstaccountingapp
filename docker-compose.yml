# ============================================================================
# GST Ledger — Docker Compose
# ============================================================================
# Local development / testing with Docker.
#
# Usage:
#   1. Copy .env.local.example to .env.local and fill in your credentials
#   2. docker compose up --build
#   3. Open http://localhost:3000
#
# The container reads environment variables from .env.local at runtime.
# NEXT_PUBLIC_ vars are also baked in at build time via build args.
# ============================================================================

services:
  gst-ledger:
    build:
      context: .
      dockerfile: Dockerfile
    image: gst-ledger:latest
    container_name: gst-ledger
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-gst-ledger-local-secret-key-32-chars-min}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
