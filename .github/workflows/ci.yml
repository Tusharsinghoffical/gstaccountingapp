name: CI & Tenant Authorization Gatekeeper

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  authorization-and-tests:
    name: Run Automated Tests, Concurrency & Cross-Tenant Authorization Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Audit for Cloud BaaS & Supabase Dependencies (Must Return Zero Results)
        run: |
          echo "=== Scanning for Supabase and AWS packages in dependency tree ==="
          if npm ls --all 2>/dev/null | grep -iE '@supabase|supabase-js|@aws-sdk|aws-sdk'; then
            echo "❌ FAIL: Supabase or AWS package(s) found in dependency tree. Must be 100% local."
            exit 1
          else
            echo "✅ PASS: Zero Supabase and zero AWS dependencies found."
          fi

      - name: Prepare SQLite Local Database
        run: |
          mkdir -p data storage backups
          npx prisma db push

      - name: Run Full Test Suite (Unit + SQLite Concurrency + Cross-Tenant Authorization)
        run: npm test
        env:
          NEXTAUTH_SECRET: ci-secret-key-for-testing-purposes-32chars
          NEXTAUTH_URL: http://localhost:3000
          GROQ_API_KEY: placeholder-groq-key

      - name: Test Backup & Restore Tooling
        run: |
          npm run backup
          npm run restore

      - name: Verify Next.js Production Build
        run: npm run build
        env:
          NEXTAUTH_SECRET: ci-secret-key-for-testing-purposes-32chars
          NEXTAUTH_URL: http://localhost:3000
          GROQ_API_KEY: placeholder-groq-key
