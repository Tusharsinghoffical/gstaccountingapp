# Render Blueprint — GST Ledger (Next.js)
# https://render.com/docs/blueprint-spec
#
# Deploy Steps:
# 1. Push this repo to GitHub
# 2. Go to https://dashboard.render.com → New → Blueprint
# 3. Connect this repo — Render auto-detects render.yaml
# 4. Set environment variables in the Render dashboard (see README.md)

services:
  - type: web
    name: gst-ledger
    runtime: node
    region: singapore          # closest to India; change to ohio/frankfurt if needed
    plan: free                 # upgrade to starter/standard for production SLAs
    branch: main

    buildCommand: npm ci && npm run build
    startCommand: npm start

    # Health check — Render uses this to verify the service is up
    healthCheckPath: /

    # Auto-deploy on every push to main
    autoDeploy: true

    # Environment variables — set the actual values in the Render dashboard.
    # DO NOT hard-code secrets here; this file is committed to git.
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.19.0
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"

      # ── Supabase ──────────────────────────────────────────────────────────
      # Set these in Render Dashboard → Environment → Add Environment Variable
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false            # marks as secret — Render will prompt you to fill it
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # ── Groq AI ───────────────────────────────────────────────────────────
      - key: GROQ_API_KEY
        sync: false
